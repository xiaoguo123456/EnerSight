# CI：codegen 一致性 + lint + 测试 + 镜像构建。与本地 make check 同一入口。
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4  # 版本取 package.json 的 packageManager
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: packages/server/uv.lock

      - run: pnpm install --frozen-lockfile
      - run: cd packages/server && uv sync --frozen
      - run: make check

  image:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # 只验证能构建，不推送；推送到 ACR 走 docs/10 的中转流程
      - uses: docker/build-push-action@v6
        with:
          context: packages/server
          platforms: linux/amd64
          push: false
          tags: enersight/api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
