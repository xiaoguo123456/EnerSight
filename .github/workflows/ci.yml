# CI：codegen 一致性 + lint + 测试 + 镜像构建。与本地 make check 同一入口。
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4  # 版本取 package.json 的 packageManager
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: packages/server/uv.lock

      - run: pnpm install --frozen-lockfile
      - run: cd packages/server && uv sync --frozen
      - run: make check

  image:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # CI 只验证构建；推送 ACR 和生产更新由 prod.yml 手动触发。
      - uses: docker/build-push-action@v6
        with:
          context: packages/server
          platforms: linux/amd64
          push: false
          tags: enersight/api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  postgres:
    name: PostgreSQL 16 兼容性
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: enersight_test
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: enersight_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U enersight_test -d enersight_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      ENERSIGHT_DATABASE_URL: postgresql+asyncpg://enersight_test:ci-only-password@localhost:5432/enersight_test
      ENERSIGHT_ENABLE_SCHEDULER: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: packages/server/uv.lock
      - working-directory: packages/server
        run: |
          uv sync --frozen
          uv run alembic upgrade head
          uv run alembic check
          uv run python scripts/check_postgres.py
