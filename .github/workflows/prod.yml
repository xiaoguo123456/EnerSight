name: 生产部署

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: '已合入 main 的完整 40 位提交 SHA'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: enersight-production
  cancel-in-progress: false

env:
  IMAGE_NAME: enersight-backend

jobs:
  checks:
    name: 发布前检查
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: enersight_test
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: enersight_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U enersight_test -d enersight_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 验证并选择发布提交
        id: release
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
        run: |
          [[ "$REQUESTED_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
          git merge-base --is-ancestor "$REQUESTED_SHA" origin/main
          git checkout --detach "$REQUESTED_SHA"
          echo "sha=$REQUESTED_SHA" >> "$GITHUB_OUTPUT"
          echo "tag=${REQUESTED_SHA:0:12}" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: packages/server/uv.lock
      - run: pnpm install --frozen-lockfile
      - run: cd packages/server && uv sync --frozen
      - run: make check
      - name: 验证 PostgreSQL 16 迁移和写入
        working-directory: packages/server
        env:
          ENERSIGHT_DATABASE_URL: postgresql+asyncpg://enersight_test:ci-only-password@localhost:5432/enersight_test
          ENERSIGHT_ENABLE_SCHEDULER: 'false'
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run python scripts/check_postgres.py

  deploy:
    name: 构建镜像并发布生产
    needs: checks
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.checks.outputs.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - name: 构建并推送固定提交镜像
        id: build
        uses: docker/build-push-action@v6
        with:
          context: packages/server
          platforms: linux/amd64
          push: true
          tags: ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ needs.checks.outputs.tag }}
          cache-from: type=gha,scope=production
          cache-to: type=gha,mode=max,scope=production
      - name: 准备已验证的 SSH 凭据
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: 上传部署文件并执行更新
        env:
          PROD_HOST: ${{ secrets.PROD_SSH_HOST }}
          PULL_REGISTRY: ${{ secrets.ACR_PULL_REGISTRY }}
          NAMESPACE: ${{ secrets.ACR_NAMESPACE }}
          TAG: ${{ needs.checks.outputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          [[ "$PROD_HOST" =~ ^[a-zA-Z0-9.-]+$ ]] || exit 1
          IMAGE="$PULL_REGISTRY/$NAMESPACE/$IMAGE_NAME:$TAG@$DIGEST"
          [[ "$IMAGE" =~ ^[a-zA-Z0-9./_-]+:[a-f0-9]{12}@sha256:[a-f0-9]{64}$ ]] || exit 1
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes root@"$PROD_HOST" 'install -d -m 750 /opt/enersight/scripts'
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes deploy/docker-compose.yml root@"$PROD_HOST":/opt/enersight/docker-compose.yml
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes deploy/scripts/*.sh root@"$PROD_HOST":/opt/enersight/scripts/
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes root@"$PROD_HOST" "bash /opt/enersight/scripts/deploy.sh '$IMAGE'"
          echo "发布镜像：$IMAGE" >> "$GITHUB_STEP_SUMMARY"
          echo '公网入口：https://platform.qhzhiyin.com/enersight/' >> "$GITHUB_STEP_SUMMARY"
      - name: 清理临时 SSH 密钥
        if: always()
        run: rm -f ~/.ssh/id_ed25519
