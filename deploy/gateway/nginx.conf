# platform.qhzhiyin.com 共用网关。ALB 终止 TLS，网关以 host 网络监听 8089。
# 独立于 huahuadog / steward；新增服务在 services/ 下增加 location。
map $http_upgrade $platform_connection_upgrade {
    default upgrade;
    '' close;
}
map $http_x_forwarded_proto $platform_forwarded_proto {
    default $http_x_forwarded_proto;
    '' $scheme;
}
server {
    listen 8089;
    server_name platform.qhzhiyin.com;
    client_max_body_size 32m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $platform_forwarded_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $platform_connection_upgrade;
    proxy_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    location = /gateway-health { access_log off; return 200 'ok\n'; }
    include /etc/nginx/platform-services/*.conf;

    # 保持现有 New API 的根路径、流式响应和 WebSocket。
    location / { proxy_pass http://127.0.0.1:3001; }
}
