location = /enersight { return 308 /enersight/; }
location /enersight/ {
    # 保留业务前缀；FastAPI root_path 和挂载的静态图片路由统一处理。
    proxy_pass http://127.0.0.1:8001;
    # 公网入口强制 HTTPS；ALB 未传协议头时也生成可直接加载的 HTTPS 图片地址。
    # location 设置协议头后需同时声明其余代理头，避免覆盖 server 级继承。
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $platform_connection_upgrade;
}
