# 插入花花狗 deploy/nginx.conf 的 server 块内；测试容器加入 weishen-test_default 网络。
    # 晴川观象测试后端：只对测试域名开放，保留 /enersight 前缀。
    # 动态解析容器别名，后端重建或尚未部署时不影响微身站点启动。
    location = /enersight {
        if ($host != test-www.qhzhiyin.com) { return 404; }
        return 308 https://test-www.qhzhiyin.com/enersight/;
    }
    location /enersight/ {
        if ($host != test-www.qhzhiyin.com) { return 404; }
        resolver 127.0.0.11 valid=10s;
        set $enersight_upstream http://enersight-test-api:8000;
        proxy_pass $enersight_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
