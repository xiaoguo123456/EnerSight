# EnerSight BFF 生产 Compose。docs/10-deployment.md
# 只跑应用容器；PostgreSQL 用外部托管实例。镜像固定摘要，升级时改这里并提交，禁止 latest。
name: enersight-prod

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  api:
    image: ${ENERSIGHT_IMAGE:-<ACR 地址>/enersight/api:<固定版本>@sha256:<摘要>}
    restart: unless-stopped
    init: true
    env_file:
      - .env
    ports:
      - "8001:8000"
    volumes:
      # 渲染好的图层瓦片、卫星归档帧、校准缓存。丢了会重新生成，但归档帧无法补
      - ./data:/app/data
    logging: *default-logging
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
